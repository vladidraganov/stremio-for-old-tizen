<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stremio</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    html,body{margin:0;padding:0;background:#14131f;}
    #diag{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;
          background:#14131f;color:#e6e6f0;font-family:monospace;font-size:17px;
          padding:12px 20px;overflow:auto;}
    #diag h2{color:#ff5b5b;font-size:21px;margin:0 0 6px 0;}
    #diag .hd{color:#8c6bff;font-weight:bold;margin-top:9px;
              border-top:1px solid #33314d;padding-top:3px;}
    #diag .ok{color:#4ad07a;}
    #diag .no{color:#ff5b5b;font-weight:bold;}
    #diag .wa{color:#ffc14d;}
    #diag .dim{color:#a9a9c4;}
    #diag pre{white-space:pre-wrap;word-wrap:break-word;margin:2px 0;font-size:16px;}

    /* Streaming-server picker. ES5-era CSS only: no variables, no grid. */
    #srvprompt{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483600;
               background:rgba(8,7,20,0.78);font-family:'PlusJakartaSans',Arial,sans-serif;
               -webkit-box-align:center;-webkit-align-items:center;align-items:center;
               -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;}
    #srvprompt.open{display:-webkit-box;display:-webkit-flex;display:flex;}
    #srvprompt .sp-card{width:980px;max-width:86%;background:#1b1934;border-radius:22px;
                        padding:46px 52px 38px;box-shadow:0 30px 90px rgba(0,0,0,0.6);color:#fff;}
    #srvprompt .sp-title{font-size:40px;font-weight:bold;margin:0 0 12px;}
    #srvprompt .sp-sub{font-size:26px;color:#b9b6d6;margin:0 0 32px;line-height:1.35;}
    #srvprompt .sp-row{border:3px solid transparent;border-radius:14px;padding:20px 26px;
                       margin-bottom:12px;background:#24224a;}
    #srvprompt .sp-row.sel{border-color:#8c6bff;background:#33307a;}
    #srvprompt .sp-main{font-size:30px;font-weight:bold;}
    #srvprompt .sp-meta{font-size:22px;color:#b9b6d6;margin-top:6px;}
    #srvprompt .sp-tag{font-size:20px;color:#4ad07a;margin-left:12px;font-weight:normal;}
    #srvprompt .sp-bar{height:10px;background:#24224a;border-radius:5px;overflow:hidden;margin:6px 0 10px;}
    #srvprompt .sp-fill{height:10px;background:#8c6bff;width:0;}
    #srvprompt .sp-hint{font-size:21px;color:#8e8aad;margin-top:24px;}
    #srvprompt .sp-ok{color:#4ad07a;}
    #srvprompt .sp-bad{color:#ff7a7a;}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="diag"></div>
  <div id="srvprompt"></div>

  <!-- ES5-ONLY instrumentation. MUST run before bundle.js. -->
  <script>
  (function () {
    var BUILD = '__BUILD_ID__';
    var T0 = new Date().getTime();
    function ms() { return new Date().getTime() - T0; }

    var net = [];      /* every network request */
    var logs = [];     /* console output */
    var errors = [];   /* errors + rejections */
    var shown = false;
    var scan = { running: false, done: 0, total: 0, found: [], subnet: '' };

    function note(a) { if (logs.length < 120) logs.push('[' + ms() + 'ms] ' + a); }

    /* ---- capture console ---- */
    var C = window.console || {};
    function wrap(kind) {
      var orig = C[kind];
      C[kind] = function () {
        var parts = [];
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          try {
            parts.push(a && a.message ? (a.name + ': ' + a.message)
                     : (typeof a === 'object' ? JSON.stringify(a).slice(0, 300) : String(a)));
          } catch (e) { parts.push('[unprintable]'); }
        }
        var line = kind.toUpperCase() + ': ' + parts.join(' ');
        if (kind === 'error' || kind === 'warn') { errors.push('[' + ms() + 'ms] ' + line); }
        else { note(line); }
        if (orig) { try { orig.apply(C, arguments); } catch (e) {} }
      };
    }
    wrap('log'); wrap('warn'); wrap('error'); wrap('info');

    /* ---- capture errors + promise rejections ---- */
    function describe(r) {
      if (!r) return String(r);
      var out = (r.name ? r.name + ': ' : '') + (r.message || String(r));
      if (r.stack) {
        var st = String(r.stack).split('\n').slice(0, 14).join('\n');
        out += '\n' + st;
      }
      return out;
    }

    window.onerror = function (msg, file, line, col, err) {
      errors.push('[' + ms() + 'ms] ERROR: ' + msg + '\n    at ' + file + ':' + line + ':' + col +
                  (err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 14).join('\n') : ''));
      return false;
    };
    window.onunhandledrejection = function (e) {
      errors.push('[' + ms() + 'ms] UNHANDLED REJECTION: ' + describe(e && e.reason));
    };
    try {
      window.addEventListener('unhandledrejection', function (e) {
        errors.push('[' + ms() + 'ms] REJECTION: ' + describe(e && e.reason));
      });
    } catch (e) {}

    /* ---- instrument Worker (worker SyntaxErrors never reach window.onerror) ---- */
    var workers = [];
    if (typeof window.Worker === 'function') {
      var OrigWorker = window.Worker;
      var PatchedWorker = function (url, opts) {
        var w = new OrigWorker(url, opts);
        var rec = { t0: ms(), url: String(url).slice(0, 80), state: 'created', msgs: 0 };
        workers.push(rec);
        try {
          w.addEventListener('error', function (ev) {
            rec.state = 'ERROR';
            errors.push('[' + ms() + 'ms] WORKER ERROR: ' +
                        (ev.message || '(no message - likely SyntaxError in worker script)') +
                        (ev.filename ? ('\n    at ' + ev.filename + ':' + ev.lineno) : ''));
          });
          w.addEventListener('message', function () { rec.msgs++; rec.state = 'replying'; });
        } catch (e) {}
        return w;
      };
      PatchedWorker.prototype = OrigWorker.prototype;
      window.Worker = PatchedWorker;
      try { self.Worker = PatchedWorker; } catch (e) {}
    }

    /* ---- instrument Tizen AVPlay (the native player path) ---- */
    var avplay = { url: '', opens: 0, prepares: 0, state: 'not used', lastError: '' };
    try {
      if (window.webapis && webapis.avplay) {
        var AV = webapis.avplay;

        var origOpen = AV.open;
        AV.open = function (url) {
          avplay.opens++;
          avplay.url = String(url);
          avplay.state = 'opened';
          note('AVPlay.open(' + avplay.url + ')');
          return origOpen.apply(AV, arguments);
        };

        var origPrepare = AV.prepareAsync;
        AV.prepareAsync = function (ok, fail) {
          avplay.prepares++;
          avplay.state = 'preparing (attempt ' + avplay.prepares + ')';
          note('AVPlay.prepareAsync #' + avplay.prepares);
          var t = ms();
          return origPrepare.call(AV, function () {
            avplay.state = 'PREPARED ok in ' + (ms() - t) + 'ms';
            note('AVPlay PREPARE SUCCESS (' + (ms() - t) + 'ms)');
            if (ok) { ok(); }
          }, function (e) {
            var msg = (e && (e.message || e.name)) ? (e.name + ': ' + e.message) : String(e);
            avplay.state = 'PREPARE FAILED after ' + (ms() - t) + 'ms';
            avplay.lastError = msg;
            errors.push('[' + ms() + 'ms] AVPLAY PREPARE ERROR (' + (ms() - t) + 'ms): ' + msg +
                        '\n    url: ' + avplay.url);
            if (fail) { fail(e); }
          });
        };
      }
    } catch (e) {}

    /* ---- instrument fetch ---- */
    function record(method, url) {
      var rec = { m: method, u: String(url).slice(0, 150), t0: ms(), done: false, status: '', err: '' };
      /* the LAN scan fires 254 requests - keep them out of the visible log */
      if (!(scan && scan.running) && net.length < 80) { net.push(rec); }
      return rec;
    }
    if (typeof window.fetch === 'function') {
      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = (input && input.url) ? input.url : input;
        var rec = record((init && init.method) || 'GET', url);
        var p;
        try { p = origFetch.apply(window, arguments); }
        catch (e) { rec.done = true; rec.err = 'THREW ' + e.message; rec.t1 = ms(); throw e; }
        return p.then(function (r) {
          rec.done = true; rec.t1 = ms(); rec.status = r.status; return r;
        }, function (e) {
          rec.done = true; rec.t1 = ms(); rec.err = (e && e.message) ? e.message : String(e);
          throw e;
        });
      };
    }

    /* ---- instrument XHR ---- */
    if (window.XMLHttpRequest) {
      var OrigOpen = XMLHttpRequest.prototype.open;
      var OrigSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.open = function (m, u) {
        this.__rec = record(m + '(xhr)', u);
        return OrigOpen.apply(this, arguments);
      };
      XMLHttpRequest.prototype.send = function () {
        var self = this, rec = this.__rec;
        if (rec) {
          this.addEventListener('load', function () { rec.done = true; rec.t1 = ms(); rec.status = self.status; });
          this.addEventListener('error', function () { rec.done = true; rec.t1 = ms(); rec.err = 'network error'; });
          this.addEventListener('timeout', function () { rec.done = true; rec.t1 = ms(); rec.err = 'timeout'; });
          this.addEventListener('abort', function () { rec.done = true; rec.t1 = ms(); rec.err = 'aborted'; });
        }
        return OrigSend.apply(this, arguments);
      };
    }

    /* ---- live TLS / connectivity self-tests ---- */
    var probes = [];
    /* okCodes: HTTP statuses that mean "this worked". A POST to /api/login with
       an empty body legitimately answers 400 - that is a SUCCESS here, because
       it proves the POST method survived. A 405 would mean the method was
       dropped (the Reflect.set failure we fixed). */
    function probe(label, url, method, body, okCodes, note) {
      var p = { label: label, url: url, state: 'running', t0: ms(),
                ok: false, okCodes: okCodes || [200], note: note || '' };
      probes.push(p);
      try {
        var x = new XMLHttpRequest();
        x.open(method || 'GET', url, true);
        if (body) { try { x.setRequestHeader('Content-Type', 'application/json'); } catch (e) {} }
        x.timeout = 15000;
        x.onload = function () {
          p.state = 'HTTP ' + x.status;
          p.t1 = ms();
          for (var i = 0; i < p.okCodes.length; i++) { if (x.status === p.okCodes[i]) { p.ok = true; } }
          if (x.status === 405) { p.state += ' - METHOD DROPPED'; }
        };
        x.onerror = function () { p.state = 'FAILED (TLS/network)'; p.t1 = ms(); };
        x.ontimeout = function () { p.state = 'TIMEOUT'; p.t1 = ms(); };
        x.send(body || null);
      } catch (e) { p.state = 'THREW ' + e.message; }
    }

    var D;
    function line(html, cls) {
      var d = document.createElement('div');
      if (cls) d.className = cls;
      d.innerHTML = html;
      D.appendChild(d);
    }
    function head(t) { line(t, 'hd'); }

    function render(reason) {
      var box = document.getElementById('diag');
      box.innerHTML = '';
      D = box;

      var h = document.createElement('h2');
      h.innerHTML = 'STREMIO DIAGNOSTIC ' + BUILD + ' &mdash; ' + reason + '  (t=' + ms() + 'ms)';
      box.appendChild(h);

      var rootEl = document.getElementById('root');
      line('bundle executed: <span class="ok">' + (document.getElementsByTagName('style').length > 1 ? 'YES' : 'NO') +
           '</span>   #root children: ' + (rootEl ? rootEl.children.length : '?') +
           '   loading screen: ' + (document.querySelector('[class*="app-loading"]') ? 'STILL PRESENT' : 'gone'), 'dim');

      head('STREAMING SERVER URL  [press RED to force]');
      line('current : <span class="' + (srv.current === SERVER_URL ? 'ok' : 'no') + '">' + srv.current + '</span>');
      line('target  : <span class="dim">' + SERVER_URL + '</span>   ' + (srv.note || ''));

      head('LAN SCAN for Stremio server  [press YELLOW]');
      if (!scan.total) {
        line('not run - press YELLOW to scan this subnet for port 11470', 'dim');
      } else {
        line('subnet  : ' + (scan.subnet || '?'), 'dim');
        line('progress: ' + scan.done + '/' + scan.total + (scan.running ? ' (scanning...)' : ' (done)'), 'wa');
        if (scan.found.length) {
          for (var fi = 0; fi < scan.found.length; fi++) {
            var fs0 = scan.found[fi];
            line('FOUND: <span class="ok">' + esc(fs0.url) + '</span>  ' +
                 esc(fs0.kind) + (fs0.version ? ' v' + esc(fs0.version) : ''));
          }
        } else if (!scan.running) {
          line('no Stremio server found on this subnet', 'no');
        }
      }

      head('AVPLAY SELF-TEST  [press GREEN to run / next stream]');
      if (!selftest.ran) {
        line('not run yet - press the GREEN button to test a direct HTTPS stream', 'dim');
      } else {
        var stCls = (selftest.stage.indexOf('PREPARED') === 0) ? 'ok'
                  : (selftest.stage.indexOf('FAILED') !== -1 ? 'no' : 'wa');
        line('stream  : ' + selftest.name, 'dim');
        line('url     : <span class="dim">' + selftest.url + '</span>');
        line('result  : <span class="' + stCls + '">' + selftest.stage + '</span>');
        line('duration: ' + (selftest.duration || '-') +
             '   currentTime samples: ' + (selftest.times.join(', ') || '-'));
        var advancing = selftest.times.length > 1 &&
                        Number(selftest.times[selftest.times.length - 1]) > Number(selftest.times[0]);
        line('decoding: <span class="' + (advancing ? 'ok' : 'wa') + '">' +
             (advancing ? 'YES - time is advancing, TV is playing it' : 'no movement yet') + '</span>');
        if (selftest.err) { line('error   : <span class="no">' + selftest.err + '</span>'); }
      }

      head('TIZEN AVPLAY (native player)');
      line('state: <span class="' + (avplay.state.indexOf('PREPARED') === 0 ? 'ok'
            : (avplay.state.indexOf('FAILED') !== -1 ? 'no' : 'wa')) + '">' + avplay.state +
           '</span>  open() calls: ' + avplay.opens + '  prepareAsync(): ' + avplay.prepares);
      line('stream url: <span class="wa">' + (avplay.url || '(none yet)') + '</span>');
      if (avplay.lastError) { line('last error: <span class="no">' + avplay.lastError + '</span>'); }

      head('WEB WORKERS (' + workers.length + ')');
      if (!workers.length) {
        line('NONE created.', 'no');
      } else {
        for (var w = 0; w < workers.length; w++) {
          var wr = workers[w];
          var wc = (wr.state === 'ERROR') ? 'no' : (wr.msgs > 0 ? 'ok' : 'wa');
          line('worker ' + (w + 1) + ': <span class="' + wc + '">' + wr.state +
               '</span> messages back: ' + wr.msgs + ' <span class="dim">' + wr.url + '</span>');
        }
      }

      head('NETWORK REQUESTS MADE BY THE APP (' + net.length + ')');
      if (!net.length) {
        line('NONE. The app made no network calls at all.', 'no');
      } else {
        for (var i = 0; i < net.length; i++) {
          var r = net[i];
          var st, cls;
          if (!r.done) { st = 'PENDING &gt;&gt;&gt; NEVER SETTLED (' + (ms() - r.t0) + 'ms)'; cls = 'no'; }
          else if (r.err) { st = 'FAILED: ' + r.err + ' (' + (r.t1 - r.t0) + 'ms)'; cls = 'no'; }
          else { st = 'HTTP ' + r.status + ' (' + (r.t1 - r.t0) + 'ms)'; cls = 'ok'; }
          line('<span class="dim">' + r.m + '</span> ' + r.u + '<br>&nbsp;&nbsp;&nbsp;<span class="' + cls + '">' + st + '</span>');
        }
      }

      head('CONNECTIVITY / TLS SELF-TESTS');
      for (var j = 0; j < probes.length; j++) {
        var p = probes[j];
        var pc = p.ok ? 'ok' : (p.state === 'running' ? 'wa' : 'no');
        line(p.label + ': <span class="' + pc + '">' + p.state + '</span> <span class="dim">' + (p.note || p.url) + '</span>');
      }

      head('ERRORS / WARNINGS (' + errors.length + ')');
      if (!errors.length) line('(none)', 'dim');
      else { var pe = document.createElement('pre'); pe.className = 'no'; pe.innerHTML = errors.join('\n'); box.appendChild(pe); }

      head('CONSOLE LOG (last 25 of ' + logs.length + ')');
      var pl = document.createElement('pre');
      pl.className = 'dim';
      pl.innerHTML = logs.slice(-25).join('\n') || '(none)';
      box.appendChild(pl);
    }

    var visible = false;
    function hide() {
      visible = false;
      document.getElementById('diag').style.display = 'none';
    }
    function show(reason) {
      visible = true;
      document.getElementById('diag').style.display = 'block';
      if (!shown) {
        shown = true;
        probe('api.strem.io POST', 'https://api.strem.io/api/login', 'POST', '{}', [200,400], 'expect 400; 405 = method dropped');
        probe('cinemeta addon GET', 'https://v3-cinemeta.strem.io/manifest.json', 'GET', null, [200], '');
        if (SERVER_URL) {
          probe('streaming server', SERVER_URL + 'settings', 'GET', null, [200], 'the LAN Stremio server this app uses');
        }
        setInterval(function () { if (visible) { render(reason); } }, 2000);
      }
      render(reason);
    }

    setTimeout(function () {
      var rootEl = document.getElementById('root');
      if (!rootEl || rootEl.children.length === 0) show('APP NEVER MOUNTED');
      else if (document.querySelector('[class*="app-loading"]')) show('STUCK ON LOADING SCREEN');
    }, 45000);

    /* ---- AVPlay self-test: can this TV play a plain direct HTTPS URL? ----
       This is what a debrid / direct-link addon hands the player, with no
       streaming server involved. Runs AVPlay directly, bypassing Stremio. */
    var TESTS = [
      { name: 'H.264 720p MP4 (HTTPS)', url: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4' },
      { name: 'H.264 MP4 (HTTPS, larger)', url: 'https://media.w3.org/2010/05/sintel/trailer.mp4' },
      { name: 'HLS m3u8 (HTTPS)', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
      { name: 'HEVC/H.265 720p MP4', url: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h265/720/Big_Buck_Bunny_720_10s_1MB.mp4' },
      { name: 'HEVC/H.265 1080p MP4', url: 'https://test-videos.co.uk/vids/jellyfish/mp4/h265/1080/Jellyfish_1080_10s_1MB.mp4' }
    ];
    var testIdx = 0;
    var selftest = { ran: false, name: '', url: '', stage: '', times: [], duration: '', err: '' };

    function runSelfTest() {
      if (!window.webapis || !webapis.avplay) { selftest.err = 'webapis.avplay missing'; return; }
      var t = TESTS[testIdx % TESTS.length];
      testIdx++;
      selftest = { ran: true, name: t.name, url: t.url, stage: 'starting', times: [], duration: '', err: '' };

      /* AVPlay needs an <object type="application/avplayer"> render surface. */
      var obj = document.getElementById('avtest');
      if (!obj) {
        obj = document.createElement('object');
        obj.id = 'avtest';
        obj.type = 'application/avplayer';
        obj.style.position = 'fixed';
        obj.style.left = '0'; obj.style.top = '0';
        obj.style.width = '100%'; obj.style.height = '100%';
        obj.style.zIndex = '1';
        document.body.insertBefore(obj, document.body.firstChild);
      }

      try { webapis.avplay.close(); } catch (e) {}
      try {
        selftest.stage = 'open';
        webapis.avplay.open(t.url);
        selftest.stage = 'setDisplayRect';
        webapis.avplay.setDisplayRect(0, 0,
          window.innerWidth || 1920, window.innerHeight || 1080);
        selftest.stage = 'prepareAsync';
        var t0 = ms();
        webapis.avplay.prepareAsync(function () {
          selftest.stage = 'PREPARED in ' + (ms() - t0) + 'ms';
          try { selftest.duration = String(webapis.avplay.getDuration()); } catch (e) { selftest.duration = 'err'; }
          try { webapis.avplay.play(); selftest.stage += ' + play()'; } catch (e) { selftest.err = 'play(): ' + e.message; }
          /* If currentTime advances, the TV is genuinely decoding. */
          var n = 0;
          var iv = setInterval(function () {
            n++;
            try { selftest.times.push(webapis.avplay.getCurrentTime()); } catch (e) { selftest.times.push('err'); }
            if (n >= 5) { clearInterval(iv); }
            if (shown) { render('AVPLAY SELF-TEST'); }
          }, 1500);
        }, function (e) {
          selftest.stage = 'PREPARE FAILED after ' + (ms() - t0) + 'ms';
          selftest.err = (e && (e.name || e.message)) ? (e.name + ': ' + e.message) : String(e);
          if (shown) { render('AVPLAY SELF-TEST'); }
        });
      } catch (e) {
        selftest.err = selftest.stage + ' threw: ' + e.message;
      }
      show('AVPLAY SELF-TEST');
    }

    /* ---- LAN scan for an existing Stremio streaming server ----------------
       Any device already running Stremio (an LG webOS TV, a NAS, a phone)
       serves the streaming server on 11470. If one answers, its URL can go
       straight into Settings -> SERVER and torrents work with no debrid. */
    /* Ask Tizen for this TV's own IP so the scan works on any network. */
    function detectSubnet(cb) {
      var done = false;
      function finish(prefix, ip) { if (!done) { done = true; cb(prefix, ip); } }
      function ask(prop) {
        try {
          tizen.systeminfo.getPropertyValue(prop, function (d) {
            var ip = d && d.ipAddress;
            if (ip && /^\d+\.\d+\.\d+\.\d+$/.test(ip)) { finish(ip.replace(/\.\d+$/, '.'), ip); }
          }, function () {});
        } catch (e) {}
      }
      if (window.tizen && tizen.systeminfo) { ask('ETHERNET_NETWORK'); ask('WIFI_NETWORK'); }
      setTimeout(function () { finish(null, null); }, 2500);
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function ipValue(ip) {
      var p = ip.split('.');
      return ((+p[0]) * 16777216) + ((+p[1]) * 65536) + ((+p[2]) * 256) + (+p[3]);
    }

    function normUrl(u) { return String(u || '').replace(/\/?$/, '/'); }

    /* Best-effort label from the server's install path, so the picker can say
       "LG TV (webOS)" rather than a bare address. Never trusted for anything. */
    function describeServer(json) {
      var v = (json && json.values) || {};
      var p = String(v.appPath || '');
      var kind = /\/palm\//.test(p) ? 'LG TV (webOS)'
               : /android|\/data\/user/i.test(p) ? 'Android device'
               : /^[A-Za-z]:\\|AppData/.test(p) ? 'Windows PC'
               : /\/Library\//.test(p) ? 'Mac'
               : /^\/home\//.test(p) ? 'Linux computer'
               : 'Stremio server';
      return { kind: kind, version: String(v.serverVersion || '') };
    }

    /* Is a Stremio server answering at this URL? cb(ok, json) */
    function checkServer(url, cb) {
      var x, finished = false;
      function fin(ok, json) { if (!finished) { finished = true; cb(ok, json); } }
      if (!url) { fin(false, null); return; }
      try {
        x = new XMLHttpRequest();
        x.open('GET', normUrl(url) + 'settings', true);
        x.timeout = 4000;
        x.onload = function () {
          var j = null;
          try { j = JSON.parse(x.responseText); } catch (e) {}
          fin(x.status === 200 && !!(j && j.values), j);
        };
        x.onerror = function () { fin(false, null); };
        x.ontimeout = function () { fin(false, null); };
        x.send();
      } catch (e) { fin(false, null); }
    }

    /* opts: { manual: bool, deadUrl: string } */
    function scanLan(opts) {
      if (scan.running) { return; }
      opts = opts || {};
      if (opts.manual) { prompt.opts = opts; promptSearching(); }
      detectSubnet(function (prefix, ip) { startScan(prefix, ip, opts); });
    }

    function startScan(prefix, ownIp, opts) {
      /* Fall back to the configured server's subnet, then a common default. */
      var base = prefix;
      if (!base && SERVER_URL) {
        var m = SERVER_URL.match(/^https?:\/\/(\d+\.\d+\.\d+)\./);
        if (m) { base = m[1] + '.'; }
      }
      if (!base) { base = '192.168.1.'; }
      scan = { running: true, done: 0, total: 254, found: [], ownIp: ownIp || '',
               subnet: base + '0/24' + (ownIp ? '  (this TV: ' + ownIp + ')' : '  (guessed)') };

      /* A bounded pool rather than 254 requests at once: on a 2017 TV this
         runs alongside the app's own startup traffic. */
      var next = 1, active = 0, LIMIT = 48;

      function probeHost(ip) {
        active++;
        checkServer('http://' + ip + ':11470/', function (ok, json) {
          if (ok) {
            var d = describeServer(json);
            scan.found.push({ ip: ip, url: 'http://' + ip + ':11470/', kind: d.kind, version: d.version });
          }
          active--;
          scan.done++;
          pump();
        });
      }

      function pump() {
        while (active < LIMIT && next <= 254) {
          var ip = base + (next++);
          if (ip === ownIp) { scan.done++; continue; }
          probeHost(ip);
        }
        if (scan.running && scan.done >= scan.total) { finishScan(opts); }
      }

      var iv = setInterval(function () {
        if (visible) { render('LAN SCAN for Stremio server'); }
        if (prompt.state === 'searching') { renderPrompt(); }
        if (!scan.running) { clearInterval(iv); }
      }, 500);

      pump();
    }

    function finishScan(opts) {
      scan.running = false;
      scan.found.sort(function (a, b) { return ipValue(a.ip) - ipValue(b.ip); });
      if (visible) { render('LAN SCAN for Stremio server'); }

      if (opts.manual) {
        if (opts.cancelled) { return; }                  /* user pressed BACK mid-search */
        if (scan.found.length) { promptChoose(scan.found, opts); } else { promptNone(); }
        return;
      }

      /* Automatic: offer only servers the user hasn't already turned down. */
      var dismissed = loadDismissed(), offer = [];
      for (var i = 0; i < scan.found.length; i++) {
        if (dismissed.indexOf(scan.found[i].url) === -1) { offer.push(scan.found[i]); }
      }
      if (offer.length) { promptChoose(offer, opts); }
      note('auto-discovery: ' + scan.found.length + ' found, ' + offer.length + ' offered');
    }

    /* ---- "not now" is remembered, so auto-discovery doesn't nag ---------- */
    var DISMISS_KEY = 'stremio-tizen3.dismissedServers';
    function loadDismissed() {
      try { var v = JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]'); return v instanceof Array ? v : []; }
      catch (e) { return []; }
    }
    function dismiss(list) {
      var d = loadDismissed();
      for (var i = 0; i < list.length; i++) { if (d.indexOf(list[i].url) === -1) { d.push(list[i].url); } }
      try { localStorage.setItem(DISMISS_KEY, JSON.stringify(d)); } catch (e) {}
    }

    /* ---- the server picker ------------------------------------------------
       States: searching -> choose -> applying -> done | failed, or none.
       While open it owns the remote: see the capture-phase key handler. */
    var prompt = { open: false, state: '', items: [], sel: 0, opts: {}, msg: '', url: '' };

    function openPrompt() {
      prompt.open = true;
      document.getElementById('srvprompt').className = 'open';
    }
    function closePrompt() {
      prompt.open = false;
      prompt.state = '';
      document.getElementById('srvprompt').className = '';
    }

    function promptSearching() {
      prompt.state = 'searching';
      openPrompt();
      renderPrompt();
    }

    function promptNone() {
      prompt.state = 'none';
      openPrompt();
      renderPrompt();
    }

    function promptChoose(list, opts) {
      /* Read the live setting first so "in use" is right even if the user
         pressed YELLOW before the launch-time check had run. */
      refreshCurrent(function () {
        prompt.items = list;
        prompt.opts = opts || {};
        prompt.sel = 0;
        for (var i = 0; i < list.length; i++) {          /* start on one not already in use */
          if (normUrl(list[i].url) !== normUrl(srv.current)) { prompt.sel = i; break; }
        }
        prompt.state = 'choose';
        openPrompt();
        renderPrompt();
      });
    }

    function refreshCurrent(cb) {
      if (!window.core || !window.core.getState) { cb(); return; }
      window.core.getState('ctx').then(function (ctx) {
        var u = ctx && ctx.profile && ctx.profile.settings && ctx.profile.settings.streamingServerUrl;
        if (u) { srv.current = String(u); }
        cb();
      }, function () { cb(); });
    }

    function renderPrompt() {
      var box = document.getElementById('srvprompt');
      var h = '<div class="sp-card">';

      if (prompt.state === 'searching') {
        var pct = scan.total ? Math.floor(100 * scan.done / scan.total) : 0;
        h += '<div class="sp-title">Looking for Stremio&hellip;</div>' +
             '<div class="sp-sub">Searching your network for a device running Stremio.</div>' +
             '<div class="sp-bar"><div class="sp-fill" style="width:' + pct + '%"></div></div>' +
             '<div class="sp-hint">' + (scan.found.length ? scan.found.length + ' found so far &middot; ' : '') +
             'BACK to cancel</div>';

      } else if (prompt.state === 'none') {
        h += '<div class="sp-title">No Stremio server found</div>' +
             '<div class="sp-sub">Open Stremio on another device on this network &mdash; an LG TV, ' +
             'a PC, a NAS &mdash; then press <b>YELLOW</b> to search again.</div>' +
             '<div class="sp-hint">OK or BACK to close</div>';

      } else if (prompt.state === 'choose') {
        var many = prompt.items.length > 1;
        h += '<div class="sp-title">Stremio server found</div><div class="sp-sub">';
        if (prompt.opts.deadUrl) {
          h += 'Your current server (' + esc(prompt.opts.deadUrl.replace(/^https?:\/\//, '').replace(/\/$/, '')) +
               ') isn\'t responding. ';
        }
        h += (many ? 'Choose one' : 'Use it') + ' to play torrents on this TV?</div>';

        for (var i = 0; i < prompt.items.length; i++) {
          var it = prompt.items[i];
          var current = normUrl(it.url) === normUrl(srv.current);
          h += '<div class="sp-row' + (i === prompt.sel ? ' sel' : '') + '">' +
               '<div class="sp-main">' + esc(it.kind) +
               (current ? '<span class="sp-tag">&#10003; in use</span>' : '') + '</div>' +
               '<div class="sp-meta">' + esc(it.ip) + ':11470' +
               (it.version ? ' &middot; Stremio server v' + esc(it.version) : '') + '</div></div>';
        }
        h += '<div class="sp-row' + (prompt.sel === prompt.items.length ? ' sel' : '') + '">' +
             '<div class="sp-main">Not now</div></div>' +
             '<div class="sp-hint">&#9650;&#9660; choose &middot; OK select &middot; BACK cancel</div>';

      } else if (prompt.state === 'applying') {
        h += '<div class="sp-title">Connecting&hellip;</div>' +
             '<div class="sp-sub">' + esc(prompt.url) + '</div>';

      } else if (prompt.state === 'done') {
        h += '<div class="sp-title sp-ok">&#10003; Connected</div>' +
             '<div class="sp-sub">Torrents will now stream through ' + esc(prompt.msg) +
             '.<br>You can change this any time in Settings &rarr; Server.</div>' +
             '<div class="sp-hint">OK to continue</div>';

      } else if (prompt.state === 'failed') {
        h += '<div class="sp-title sp-bad">Saved, but not confirmed</div>' +
             '<div class="sp-sub">' + esc(prompt.msg) + '</div>' +
             '<div class="sp-hint">OK to continue</div>';
      }

      box.innerHTML = h + '</div>';
    }

    function choose() {
      if (prompt.sel >= prompt.items.length) {           /* "Not now" */
        if (!prompt.opts.manual) { dismiss(prompt.items); }
        closePrompt();
        return;
      }
      var it = prompt.items[prompt.sel];
      prompt.url = it.url;
      prompt.state = 'applying';
      renderPrompt();

      setServerUrl(it.url, function (err) {
        if (err) {
          prompt.state = 'failed';
          prompt.msg = 'Could not save the setting: ' + err;
          renderPrompt();
          return;
        }
        waitForServer(it.url, function (ok) {
          if (ok) {
            prompt.state = 'done';
            prompt.msg = it.kind + (it.version ? ' (v' + it.version + ')' : '');
            renderPrompt();
            setTimeout(function () { if (prompt.state === 'done') { closePrompt(); } }, 4000);
          } else {
            prompt.state = 'failed';
            prompt.msg = 'The address was saved, but Stremio did not report the server as online yet. ' +
                         'Check Settings → Server; if it says Offline, select Reload.';
            renderPrompt();
          }
        });
      });
    }

    function isBack(k) { return k === 10009 || k === 8 || k === 27 || k === 461; }
    function isOk(k) { return k === 13 || k === 29443 || k === 65376; }

    /* While the picker is open it must own the remote, or the app underneath
       would also move focus / navigate back. Capture phase on window runs
       before every document listener, including the app's. */
    window.addEventListener('keydown', function (ev) {
      if (!prompt.open) { return; }
      var k = ev.keyCode;
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) { ev.stopImmediatePropagation(); }

      if (prompt.state === 'choose') {
        var last = prompt.items.length;                   /* index of "Not now" */
        if (k === 38) { prompt.sel = prompt.sel > 0 ? prompt.sel - 1 : last; renderPrompt(); }
        else if (k === 40) { prompt.sel = prompt.sel < last ? prompt.sel + 1 : 0; renderPrompt(); }
        else if (isOk(k)) { choose(); }
        else if (isBack(k)) { prompt.sel = last; choose(); }
      } else if (prompt.state === 'searching') {
        if (isBack(k)) { prompt.opts.cancelled = true; closePrompt(); }   /* scan finishes silently */
      } else if (prompt.state !== 'applying') {
        if (isOk(k) || isBack(k)) { closePrompt(); }
      }
    }, true);

    /* ---- what APIs does this web runtime actually expose? ---- */
    function listApis(obj, prefix) {
      var out = [];
      try { for (var k in obj) { out.push(prefix + k); } } catch (e) {}
      return out.sort();
    }

    /* ---- point the core at the LAN streaming server --------------------
       Typing ':' on the TV keyboard is painful and easy to get wrong (a '/'
       instead of ':' silently points at port 80). CoreProvider publishes the
       transport as window.core once init resolves, so set it directly using
       the same dispatch shape stremio-web's useSettings uses. */
    var SERVER_URL = '__SERVER_URL__';
    var srv = { current: '(unknown)', applied: false, note: '' };

    function applyServerUrl(force) {
      if (!SERVER_URL) { srv.note = 'no server baked into this build'; return; }
      if (!window.core || !window.core.getState) { srv.note = 'core not ready'; return; }
      window.core.getState('ctx').then(function (ctx) {
        var settings = ctx && ctx.profile && ctx.profile.settings;
        if (!settings) { srv.note = 'no settings in ctx'; return; }
        srv.current = String(settings.streamingServerUrl);

        /* Only auto-correct the stock default or a mistyped address.
           A URL the user deliberately set is left alone unless forced. */
        var stock = srv.current === 'http://127.0.0.1:11470/' || srv.current === 'http://127.0.0.1:11470';
        /* Same host as the configured server but no port: almost certainly a
           ':' typed as '/' on the TV keyboard, which points at port 80. */
        var host = (SERVER_URL.match(/^https?:\/\/([^:\/]+)/) || [])[1] || '';
        var mistyped = !!host && srv.current.indexOf(host) !== -1 && !/:\d+/.test(srv.current);
        if (!force && !stock && !mistyped) { srv.note = 'left as-is (user set)'; return; }
        if (srv.current === SERVER_URL) { srv.note = 'already correct'; srv.applied = true; return; }

        setServerUrl(SERVER_URL, function (err) {
          srv.note = err ? 'failed: ' + err : 'set to ' + SERVER_URL;
          if (!err) { srv.applied = true; }
        });
      }, function (e) { srv.note = 'getState failed: ' + (e && e.message ? e.message : String(e)); });
    }

    /* Points the core at a streaming server - the same actions stremio-web
       dispatches, followed by the reconnect the Settings "Reload" row does. */
    function setServerUrl(url, cb) {
      if (!window.core || !window.core.getState) { cb('Stremio is still starting'); return; }
      window.core.getState('ctx').then(function (ctx) {
        var settings = ctx && ctx.profile && ctx.profile.settings;
        if (!settings) { cb('no settings in ctx'); return; }

        /* Only add to the saved list if it isn't there, so the core has no
           reason to raise an error toast. */
        var saved = (ctx && ctx.streamingServerUrls) || [], known = false;
        for (var i = 0; i < saved.length; i++) {
          if (normUrl(saved[i] && (saved[i].url || saved[i])) === normUrl(url)) { known = true; }
        }

        var merged = {};
        for (var k in settings) { merged[k] = settings[k]; }
        merged.streamingServerUrl = url;
        try {
          if (!known) { window.core.dispatch({ action: 'Ctx', args: { action: 'AddServerUrl', args: url } }); }
          window.core.dispatch({ action: 'Ctx', args: { action: 'UpdateSettings', args: merged } });
          window.core.dispatch({ action: 'StreamingServer', args: { action: 'Reload' } }, 'streaming_server');
        } catch (e) { cb(e.message); return; }

        srv.current = url;
        note('streamingServerUrl -> ' + url);
        cb(null);
      }, function (e) { cb(e && e.message ? e.message : String(e)); });
    }

    /* Polls the core until it reports this server as Ready. cb(ok) */
    function waitForServer(url, cb) {
      var tries = 0;
      function again() { if (++tries >= 20) { cb(false); } else { setTimeout(poll, 500); } }
      function poll() {
        window.core.getState('streaming_server').then(function (st) {
          var sel = st && st.selected && st.selected.transportUrl;
          var ready = st && st.settings && st.settings.type === 'Ready';
          /* Ignore a stale Ready that still belongs to the previous server. */
          if (ready && (!sel || normUrl(sel) === normUrl(url))) { cb(true); } else { again(); }
        }, again);
      }
      poll();
    }

    /* On launch: if the configured server isn't answering, look for one.
       This is what rescues you when a router hands the server a new IP. */
    var autoChecked = false;
    function autoDiscover() {
      if (autoChecked) { return; }
      autoChecked = true;
      window.core.getState('ctx').then(function (ctx) {
        var url = ctx && ctx.profile && ctx.profile.settings && ctx.profile.settings.streamingServerUrl;
        srv.current = String(url || '');
        checkServer(url, function (ok) {
          if (ok) { note('auto-discovery: configured server is up'); return; }
          var stock = /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(String(url || ''));
          scanLan({ deadUrl: stock ? '' : String(url || '') });
        });
      }, function () {});
    }

    /* Core needs a moment to initialise before window.core exists. */
    var srvTries = 0;
    var srvIv = setInterval(function () {
      srvTries++;
      if (window.core && window.core.getState) {
        clearInterval(srvIv);
        applyServerUrl(false);
        setTimeout(autoDiscover, 3000);    /* after any baked-in URL has landed */
      } else if (srvTries > 40) { srv.note = 'window.core never appeared'; clearInterval(srvIv); }
    }, 1000);

    /* Diagnostic trigger.
       NOT the BACK/RETURN key (10009) - the app needs that for navigation,
       and binding it here swallowed every Back press. Use the BLUE colour
       button instead, which must be registered with Tizen to emit events. */
    try {
      if (window.tizen && tizen.tvinputdevice) {
        tizen.tvinputdevice.registerKey('ColorF3Blue');
        tizen.tvinputdevice.registerKey('ColorF1Green');
        tizen.tvinputdevice.registerKey('ColorF2Yellow');
        tizen.tvinputdevice.registerKey('ColorF0Red');
      }
    } catch (e) {}

    document.addEventListener('keydown', function (ev) {
      if (ev.keyCode === 406) { if (visible) { hide(); } else { show('MANUAL (blue button)'); } }
      if (ev.keyCode === 404) { runSelfTest(); }   /* GREEN  = AVPlay self-test */
      if (ev.keyCode === 405) { scanLan({ manual: true }); }   /* YELLOW = find a server */
      if (ev.keyCode === 403) { applyServerUrl(true); show('SERVER URL FORCED'); }  /* RED */
    });
  })();
  </script>

  <script src="bundle.js"></script>
</body>
</html>
